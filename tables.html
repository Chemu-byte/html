<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html tables</title>
</head>
<style>
    body{
        background-color: aqua;
    }
    table{
        border: 3px;
        border-color:gold;
        border-style: solid;
    }
    th,td{
        border: 1px;
        padding: 8px;
    }
    h3{
        text-align: center;
        color: blueviolet;
        margin: 50px;
        margin: 20px auto;
    }
</style>
<body>
    <h3> Student information table</h3>
    <table>
    <tr>
        <th>Student name</th>
        <th>Age</th>
        <th>Course</th>
    </tr>
    <tr>
        <td>Jane</td>
        <td>19</td>
        <td>MIT</td>
    </tr>
    <tr>
        <td>Kamau</td>
        <td>21</td>
        <td>Cybersecurity</td>
    </tr>
    <tr>
        <td>Mary</td>
        <td>20</td>
        <td>Data Science</td>
    </tr>
    <tr>
        <td>John</td>
        <td>19</td>
        <td>Data Science</td>
    </tr>
    
    </table>   
</body>
</html>
