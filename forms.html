<body>
    <h2 id="hello">Contact us</h2>
       <form id="my form">
        <label for="fullname">Full name:</label>
        <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required></input><br>
        <label for="email">email</label>
        <input type="email" id="email" name="email" placeholder="Enter email" required><br>
        <label for="phone">Phone number</label>
        <input type="tel" id="Phone" name="phone" placeholder="Enter phone number" required></input><br>
        <label for="message">message</label>
        <textarea name="text" id="message" rows="5" required></textarea><br>
        <input type="submit" value="Send message">
        
    
    </form>
